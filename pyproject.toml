[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-incident-anomaly-detection"
version = "1.0.0"
description = "Reproducible unsupervised anomaly analysis of occupational safety incident reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "INT396 Project"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "streamlit>=1.36,<2",
  "plotly>=5.18,<7",
  "pyarrow>=14,<30",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "nbformat>=5.9,<6", "nbclient>=0.10,<1"]

[project.scripts]
safety-anomaly = "safety_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
